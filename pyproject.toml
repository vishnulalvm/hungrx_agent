[project]
name = "hungrx-agent"
version = "0.1.0"
description = "Restaurant data automation platform"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",

    # --- Schemas / validation / settings ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",

    # --- Database ---
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",

    # --- LangGraph / LLM ---
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.52",

    # --- Browser automation / crawling ---
    "playwright>=1.48",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",

    # --- Redis / background jobs ---
    "redis>=5.1",
    "rq>=2.0",

    # --- Diffing ---
    "deepdiff>=8.0",

    # --- Auth ---
    "pyjwt>=2.9",
    "bcrypt>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests", "apps/worker/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "database", "infrastructure", "langgraph"]
