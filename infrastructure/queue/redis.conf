# Redis persistence config for local/production single-server deployment.
# RDB snapshots (baseline durability) + AOF (tighter recovery point) — the
# combination Redis itself recommends when losing background-job state is
# undesirable.

# RDB snapshotting
save 900 1
save 300 10
save 60 10000
dir /data
dbfilename dump.rdb

# AOF
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec

# Keep queue data even if disk gets tight rather than silently dropping writes
stop-writes-on-bgsave-error yes
